<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Routiner" />
  <meta name="theme-color" content="#dff4ff" />
  <title>Routiner</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="portrait" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=20260725a" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png?v=20260725a" />
  <link rel="shortcut icon" href="./favicon.ico?v=20260725a" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260725a" />
  <link rel="manifest" href="./manifest.webmanifest?v=20260725a" />
  <link rel="stylesheet" href="./styles/app.css" />
</head>
<body>
  <main class="app" id="app">
    <section class="auth-screen active" id="authScreen" aria-label="로그인">
      <div class="auth-card">
        <h1 class="auth-title">Routiner</h1>
        <p class="auth-subtitle">이메일로 연결</p>
        <form class="auth-form" id="authForm">
          <input class="auth-input" id="authEmail" type="email" placeholder="이메일" autocomplete="email" autocapitalize="off" spellcheck="false" required>
          <input class="auth-input" id="authPassword" type="password" placeholder="비밀번호" autocomplete="current-password" required>
          <div class="auth-actions">
            <button class="auth-action primary" id="authLoginBtn" type="submit">로그인</button>
          </div>
          <div class="auth-message" id="authMessage" aria-live="polite">이메일/비밀번호를 입력해.</div>
        </form>
      </div>
    </section>

    <section class="home" id="homeScreen" aria-label="루틴 선택">
      <header class="topbar">
        <button class="top-btn date-btn" id="todayLabel" type="button" aria-label="달력 열기">오늘</button>
        <span class="top-spacer" aria-hidden="true"></span>
        <button class="top-btn" id="openEditBtn" type="button">수정</button>
      </header>
      <div class="hero" id="heroArea">
        <h1 id="brandTitle" role="button" tabindex="0" aria-label="관리 패널 열기">Routiner</h1>
        <div class="backup-panel" id="backupPanel" aria-hidden="true">
          <div class="backup-input-wrap">
            <textarea class="backup-input" id="backupInput" rows="1" placeholder="백업 JSON" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
            <button class="backup-clear" id="backupClearBtn" type="button" aria-label="백업 입력 비우기">×</button>
          </div>
          <button class="backup-action" id="backupImportBtn" type="button" disabled>Import</button>
          <button class="backup-action primary" id="backupExportBtn" type="button">Export</button>
          <button class="backup-action" id="backupLogoutBtn" type="button" disabled>로그아웃</button>
        </div>
      </div>
      <div class="day-plan-notice" id="dayPlanNotice" aria-live="polite"></div>
      <div class="routine-list" id="routineList"></div>
    </section>

    <section class="run" id="runScreen" aria-label="루틴 진행">
      <header class="topbar run-topbar">
        <button class="top-btn icon-top-btn list-top-btn" id="backBtn" type="button" aria-label="목록으로">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 7h11M7 12h11M7 17h11"/><path d="M4.5 7h.01M4.5 12h.01M4.5 17h.01"/></svg>
        </button>
        <div class="top-title run-step-meta" id="runStepMeta">루틴 · 1 / 1</div>
        <div class="departure-slot" id="departurePinSlot" aria-live="polite"></div>
      </header>
      <div class="run-shell">
        <div class="preview-row" aria-label="세부루틴 미리보기">
          <div class="step-preview" id="stepPreview"></div>
        </div>
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>

        <div class="task-zone">
          <div class="routine-small" id="sessionRoutineTitle">루틴</div>
          <div class="task-icon" id="taskIcon">·</div>
          <div class="task-title" id="taskTitle">루틴 선택</div>
        </div>

        <div class="timer-zone">
          <div class="timer-ring" id="timerRing">
            <div class="timer-content">
              <div class="timer-label" id="timerLabel"></div>
              <div class="timer-time" id="timerTime">00:00</div>
              <div class="timer-status" id="timerStatus">일시정지</div>
            </div>
          </div>
        </div>

        <div class="memo-wrap">
          <div class="memo-input empty" id="stepMemo"></div>
        </div>

        <div class="controls">
          <button class="main-action" id="completeBtn" type="button">완료</button>
          <button class="sub-action step-nav-action back" id="undoBtn" type="button" aria-label="이전 단계로 되돌리기">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7.5 5.5a1 1 0 0 1 1 1v3.02l8.45-4.02A1.05 1.05 0 0 1 18.5 6.45v11.1a1.05 1.05 0 0 1-1.55.95L8.5 14.48v3.02a1 1 0 1 1-2 0v-11a1 1 0 0 1 1-1Z"/></svg>
          </button>
          <button class="sub-action" id="pauseBtn" type="button">일시정지</button>
          <button class="sub-action step-nav-action forward" id="skipBtn" type="button" aria-label="다음 단계로 건너뛰기">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16.5 5.5a1 1 0 0 0-1 1v3.02L7.05 5.5A1.05 1.05 0 0 0 5.5 6.45v11.1a1.05 1.05 0 0 0 1.55.95l8.45-4.02v3.02a1 1 0 1 0 2 0v-11a1 1 0 0 0-1-1Z"/></svg>
          </button>
        </div>
      </div>
      <div class="run-day-note empty" id="runDayNote"></div>
    </section>

    <section class="done-screen" id="doneScreen" aria-label="루틴 완료">
      <div class="done-card">
        <div class="done-mark">✓</div>
        <h2 id="doneTitle">루틴 완료</h2>
        <p id="doneText">오늘 완료.</p>
      </div>
      <div class="done-actions">
        <button class="full-btn" id="doneHomeBtn" type="button">목록</button>
        <div class="done-secondary-actions">
          <button class="sub-action step-nav-action back done-undo-btn" id="doneUndoBtn" type="button" aria-label="이전 단계로 되돌리기">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7.5 5.5a1 1 0 0 1 1 1v3.02l8.45-4.02A1.05 1.05 0 0 1 18.5 6.45v11.1a1.05 1.05 0 0 1-1.55.95L8.5 14.48v3.02a1 1 0 1 1-2 0v-11a1 1 0 0 1 1-1Z"/></svg>
          </button>
          <button class="ghost-btn" id="restartBtn" type="button">처음부터 다시하기</button>
        </div>
      </div>
    </section>

    <section class="edit-screen" id="editScreen" aria-label="세부루틴 수정">
      <header class="topbar edit-topbar">
        <span class="save-status" id="saveStatus" aria-live="polite"></span>
        <div class="top-title">세부루틴 수정</div>
        <button class="top-btn" id="closeEditBtn" type="button" aria-label="수정 화면 닫기">닫기</button>
      </header>
      <div class="edit-panel">
        <div class="routine-tabs" id="routineTabs"></div>
        <div class="section-title">
          <span id="editRoutineTitle">단계</span>
          <span id="editTotalTime">약 0분</span>
        </div>
        <div class="step-editor-list" id="stepEditorList"></div>
        <button class="reset-routine-card" id="resetRoutineBtn" data-action="reset-routine" type="button" aria-label="현재 루틴을 기본값으로 재설정">기본 루틴으로 재설정</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="reward-pop" id="rewardPop" aria-hidden="true">✓</div>
  <div class="calendar-overlay" id="calendarOverlay" aria-hidden="true">
    <div class="calendar-panel" role="dialog" aria-modal="true" aria-label="월간 루틴 기록">
      <header class="calendar-head">
        <span aria-hidden="true"></span>
        <div class="calendar-month-nav" aria-label="월 이동">
          <button class="calendar-nav-btn" id="calendarPrevBtn" type="button" aria-label="이전 달"><span class="calendar-btn-glyph" aria-hidden="true">‹</span></button>
          <div class="calendar-title" id="calendarTitle">이번 달</div>
          <button class="calendar-nav-btn" id="calendarNextBtn" type="button" aria-label="다음 달"><span class="calendar-btn-glyph" aria-hidden="true">›</span></button>
        </div>
        <button class="calendar-close" id="calendarCloseBtn" type="button" aria-label="달력 닫기"><span class="calendar-btn-glyph" aria-hidden="true">×</span></button>
      </header>
      <div class="calendar-weekdays" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>

  <script src="./src/app.js"></script>
</body>
</html>
