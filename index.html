<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Routiner" />
  <meta name="theme-color" content="#dff4ff" />
  <title>Routiner</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="portrait" />
  <script>
    (() => {
      const manifest = {
        name: "Routiner",
        short_name: "Routiner",
        description: "개인 루틴 플레이어.",
        id: "./",
        start_url: "./",
        display: "standalone",
        background_color: "#dff4ff",
        theme_color: "#dff4ff",
        orientation: "portrait-primary"
      };
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
      document.head.appendChild(link);
    })();
  </script>
  <style>
    :root {
      --bg: #edf9ff;
      --panel: rgba(255, 255, 255, 0.74);
      --panel-strong: #fffaf2;
      --ink: #28231d;
      --muted: #81786b;
      --faint: #d9cfc0;
      --line: rgba(67, 54, 38, 0.12);
      --accent: #3c7d66;
      --accent-ink: #ffffff;
      --accent-soft: #dcebe4;
      --warn: #b56b43;
      --danger: #a64b43;
      --day-note-ink: #4f7688;
      --day-note-label: rgba(79, 118, 136, 0.48);
      --day-note-bg: rgba(238, 249, 253, 0.78);
      --day-note-line: rgba(79, 118, 136, 0.20);
      --shadow: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { touch-action: pan-x pan-y; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top left, #dff4ff 0, transparent 36%), var(--bg);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    body {
      height: 100dvh;
      display: flex;
      justify-content: center;
      padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
      overflow: hidden;
    }

    body.plan-mode {
      background: radial-gradient(circle at top left, #fff5df 0, transparent 36%), #f5f0e8;
    }

    button, input, textarea { font: inherit; }
    button {
      border: 0;
      cursor: pointer;
      color: inherit;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    input, textarea {
      color: var(--ink);
      font-size: 16px;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100%;
      min-height: 0;
      padding: 14px 0 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .app.plan-mode::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at top left, #fff5df 0, transparent 36%), #f5f0e8;
    }

    .app.plan-mode > * {
      position: relative;
      z-index: 1;
    }

    .app::-webkit-scrollbar { width: 0; height: 0; }

    .app.run-mode,
    .app.edit-mode { overflow: hidden; }
    .app.run-mode .topbar,
    .app.edit-mode .topbar { flex: 0 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 4px;
    }

    .top-left, .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .top-spacer {
      width: 48px;
      height: 1px;
      flex: 0 0 auto;
    }

    .save-status {
      width: 48px;
      min-height: 18px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: -0.025em;
      opacity: 0;
      transform: translateY(3px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .save-status.show {
      opacity: 0.82;
      transform: translateY(0);
    }

    .top-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.025em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      flex: 1;
    }

    .run-topbar {
      position: relative;
      min-height: 36px;
    }

    .run-step-meta {
      position: absolute;
      left: 62px;
      right: 62px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .departure-slot {
      margin-left: auto;
      width: 124px;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      z-index: 2;
      overflow: hidden;
    }

    .top-btn, .pill {
      height: 34px;
      border-radius: 999px;
      padding: 0 11px;
      background: rgba(255,255,255,0.62);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .icon-top-btn {
      width: 42px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-size: 18px;
      line-height: 1;
    }

    .pill { display: inline-grid; place-items: center; }

    .today-text {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      padding: 0 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: -0.015em;
      white-space: nowrap;
    }

    .date-btn {
      min-width: 64px;
      text-align: center;
    }

    .edit-topbar .save-status {
      justify-content: flex-start;
    }

    .icon-top-btn svg {
      width: 22px;
      height: 22px;
      display: block;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .list-top-btn {
      background: rgba(255,255,255,0.74);
      color: color-mix(in srgb, var(--ink) 58%, var(--muted));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.28);
    }

    .top-btn:disabled {
      opacity: 0.42;
      cursor: default;
    }

    .home, .run, .done-screen, .edit-screen, .auth-screen { display: none; }
    .home.active, .run.active, .done-screen.active, .edit-screen.active, .auth-screen.active { display: flex; }

    .auth-screen {
      min-height: min(100%, 760px);
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      padding: 18px 4px;
    }

    .auth-card {
      width: min(100%, 390px);
      margin: 0 auto;
      padding: 26px 18px 20px;
      border-radius: 32px;
      background: rgba(255,255,255,0.68);
      border: 1px solid var(--line);
      box-shadow: none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .auth-title {
      margin: 0 0 6px;
      color: var(--ink);
      font-size: clamp(36px, 12vw, 48px);
      line-height: 0.95;
      letter-spacing: -0.08em;
      font-weight: 980;
      text-align: center;
    }

    .auth-subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 760;
      letter-spacing: -0.045em;
      text-align: center;
    }

    .auth-form {
      display: grid;
      gap: 8px;
    }

    .auth-input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.76);
      color: var(--ink);
      font-size: 16px;
      font-weight: 720;
      letter-spacing: -0.035em;
      padding: 0 13px;
      outline: none;
    }

    .auth-input:focus {
      border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
      background: rgba(255,255,255,0.9);
    }

    .auth-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 2px;
    }

    .auth-action {
      height: 46px;
      border-radius: 17px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.64);
      color: var(--muted);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -0.045em;
    }

    .auth-action.primary {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }

    .auth-action:disabled, .auth-input:disabled {
      opacity: 0.46;
      cursor: default;
    }

    .auth-message {
      min-height: 18px;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      letter-spacing: -0.035em;
      text-align: center;
    }

    .auth-message.error {
      color: #a64b3f;
    }

    .home {
      flex-direction: column;
      gap: 14px;
    }

    .hero {
      position: relative;
      padding: 4px 2px 2px;
    }

    .hero h1 {
      display: inline-block;
      margin: 0;
      font-size: 30px;
      line-height: 1.08;
      letter-spacing: -0.055em;
      font-weight: 950;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      cursor: default;
      transition: transform 140ms ease, opacity 140ms ease;
    }

    .hero h1.long-pressing {
      transform: scale(0.982);
      opacity: 0.72;
    }

    .backup-panel {
      position: absolute;
      z-index: 80;
      top: calc(100% + 8px);
      left: 50%;
      width: min(calc(100vw - 24px), 430px);
      transform: translateX(-50%) translateY(-4px);
      opacity: 0;
      pointer-events: none;
      display: grid;
      grid-template-columns: minmax(0, 1.42fr) 62px 62px 70px;
      gap: 6px;
      padding: 7px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--line);
      box-shadow: none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .backup-panel.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .backup-input-wrap {
      position: relative;
      min-width: 0;
    }

    .backup-input {
      width: 100%;
      height: 34px;
      resize: none;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,255,255,0.72);
      color: color-mix(in srgb, var(--ink) 76%, var(--muted));
      font-size: 16px;
      line-height: 1.15;
      font-weight: 650;
      padding: 7px 27px 7px 9px;
      outline: none;
      white-space: nowrap;
    }

    .backup-input.valid {
      border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
      background: rgba(255,255,255,0.88);
    }

    .backup-input::placeholder { color: rgba(129,120,107,0.52); }

    .backup-clear {
      position: absolute;
      right: 5px;
      top: 50%;
      width: 22px;
      height: 22px;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(67, 54, 38, 0.06);
      color: rgba(129,120,107,0.72);
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
    }

    .backup-action {
      height: 34px;
      border-radius: 13px;
      background: rgba(255,255,255,0.64);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: -0.035em;
      padding: 0 6px;
      white-space: nowrap;
    }

    .backup-action.primary {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }

    .backup-action:disabled {
      opacity: 0.34;
      color: var(--muted);
      background: rgba(255,255,255,0.44);
      border-color: var(--line);
      cursor: default;
    }

    .day-plan-notice {
      display: none;
      margin: -2px 2px 2px;
      padding: 10px 12px;
      border-radius: 18px;
      background: rgba(255, 250, 242, 0.90);
      border: 1px solid rgba(67, 54, 38, 0.12);
      color: color-mix(in srgb, var(--ink) 76%, var(--muted));
      font-size: 12px;
      font-weight: 850;
      letter-spacing: -0.025em;
      line-height: 1.35;
    }

    .app.plan-mode .day-plan-notice { display: block; }

    .app.plan-mode .home {
      margin: 0;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }


    .routine-list, .step-card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .routine-card, .step-card {
      --card-accent: var(--accent);
      --card-soft: var(--accent-soft);
      width: 100%;
      text-align: left;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(67, 54, 38, 0.14);
      border-radius: 24px;
      padding: 15px 14px 15px 15px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 56px;
      align-items: center;
      gap: 12px;
      box-shadow: none;
      transition: transform 140ms ease, background 140ms ease, border 140ms ease, opacity 140ms ease, box-shadow 140ms ease, filter 140ms ease;
    }

    .routine-card.suggested {
      background: linear-gradient(145deg, rgba(247, 253, 255, 0.98), var(--card-soft));
      border-color: color-mix(in srgb, var(--card-accent) 42%, transparent);
      box-shadow: none;
    }

    .routine-card.done {
      opacity: 0.68;
      background: rgba(251, 246, 238, 0.80);
      border-color: rgba(67, 54, 38, 0.12);
      box-shadow: none;
      filter: saturate(0.94);
    }

    .routine-card.done .routine-icon {
      opacity: 0.86;
    }

    .routine-card.done .routine-meta {
      opacity: 0.80;
    }

    .routine-card.done .routine-name {
      color: color-mix(in srgb, var(--ink) 78%, var(--muted));
    }

    .routine-card.off {
      opacity: 0.34;
      background: rgba(255, 255, 255, 0.34);
      border-color: rgba(67, 54, 38, 0.08);
      box-shadow: none;
    }

    .routine-card.off .routine-icon,
    .routine-card.off .routine-state,
    .routine-card.off .routine-meta {
      opacity: 0;
    }

    .routine-card.off .routine-name {
      color: var(--muted);
    }

    .routine-card:active, .step-card:active, .top-btn:active, .main-action:active, .sub-action:active, .full-btn:active, .ghost-btn:active, .small-action:active, .icon-btn:active { transform: scale(0.985); }

    .routine-card.long-pressing {
      transform: scale(0.962);
      box-shadow: none;
    }

    .routine-icon, .step-icon-tile {
      width: 48px;
      height: 48px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 22px;
      font-weight: 900;
    }

    .routine-card-body {
      min-width: 0;
    }

    .routine-title-row {
      min-width: 0;
      min-height: 23px;
      position: relative;
      padding-right: 76px;
      display: block;
    }

    .routine-card:not(.plan-card) .routine-title-row {
      padding-right: 0;
    }

    .routine-name, .step-card-title {
      min-width: 0;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -0.025em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .routine-summary {
      color: color-mix(in srgb, var(--muted) 50%, var(--faint));
      font-size: 10px;
      font-weight: 800;
      letter-spacing: -0.035em;
      white-space: nowrap;
      opacity: 0.58;
    }

    .routine-title-row .routine-summary {
      position: absolute;
      top: 2px;
      right: 0;
    }

    .routine-side {
      width: 56px;
      min-width: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      justify-self: end;
      align-self: center;
    }

    .routine-side .routine-summary {
      width: 56px;
      text-align: center;
      transform: translateY(-1px);
      opacity: 0.50;
    }

    .routine-meta, .step-card-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      line-height: 1.35;
    }

    .routine-note {
      margin-top: 7px;
      width: fit-content;
      max-width: 100%;
      padding: 5px 8px 6px;
      border-radius: 12px;
      background: var(--day-note-bg);
      border: 1px solid var(--day-note-line);
      color: var(--day-note-ink);
      font-size: 12px;
      font-weight: 680;
      line-height: 1.28;
      letter-spacing: -0.025em;
      white-space: pre-line;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .routine-card.off .routine-note,
    .routine-card.off .routine-summary {
      display: none;
    }

    .routine-card.plan-card {
      grid-template-columns: 48px minmax(0, 1fr);
      align-items: start;
    }

    .routine-card.plan-card.off .routine-icon {
      opacity: 0.32;
    }

    .routine-card.plan-card.off .routine-state {
      opacity: 1;
      color: var(--muted);
      background: rgba(255,255,255,0.38);
      border-color: rgba(67,54,38,0.08);
    }

    .routine-card.plan-card.off .day-note-input {
      display: none;
    }

    .plan-control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }

    .plan-control-chip {
      min-height: 28px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.54);
      border: 1px solid rgba(67,54,38,0.12);
      color: color-mix(in srgb, var(--ink) 64%, var(--muted));
      font-size: 11px;
      font-weight: 850;
      letter-spacing: -0.025em;
    }

    .plan-control-chip.active {
      background: color-mix(in srgb, var(--card-accent) 12%, white);
      border-color: color-mix(in srgb, var(--card-accent) 28%, rgba(67,54,38,0.12));
      color: color-mix(in srgb, var(--card-accent) 76%, var(--ink));
    }

    .plan-control-chip.muted.active {
      background: rgba(67,54,38,0.08);
      border-color: rgba(67,54,38,0.12);
      color: var(--muted);
    }

    .day-note-input {
      width: 100%;
      min-height: 54px;
      max-height: 80px;
      margin-top: 8px;
      padding: 10px 11px;
      border-radius: 14px;
      border: 1px solid var(--day-note-line);
      background: var(--day-note-bg);
      color: var(--day-note-ink);
      resize: none;
      overflow-y: auto;
      font-size: 16px;
      line-height: 1.28;
      font-weight: 620;
      letter-spacing: -0.02em;
      outline: none;
    }

    .day-note-input::placeholder {
      color: var(--day-note-label);
      font-weight: 650;
    }

    .step-card-meta {
      white-space: pre-line;
      line-height: 1.32;
    }

    .routine-state, .step-time-pill {
      font-size: 12px;
      font-weight: 850;
      padding: 7px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.64);
      color: var(--muted);
      border: 1px solid var(--line);
      white-space: nowrap;
    }

    .routine-state {
      width: 50px;
      min-height: 31px;
      padding: 5px 7px;
      display: inline-grid;
      place-items: center;
      justify-self: end;
      box-shadow: none;
    }

    .routine-state.finished {
      background: var(--card-accent);
      color: #fff;
      border-color: transparent;
    }

    .routine-state.off {
      background: transparent;
      border-color: transparent;
      color: transparent;
    }



    .run-day-note {
      flex: 0 0 auto;
      width: min(100%, 328px);
      margin: 8px auto 0;
      padding: 7px 12px 9px;
      border-radius: 16px;
      background: var(--day-note-bg);
      border: 1px solid var(--day-note-line);
      color: var(--day-note-ink);
      letter-spacing: -0.025em;
      overflow: hidden;
      box-shadow: none;
    }

    .run-day-note-label {
      margin-bottom: 3px;
      text-align: center;
      color: var(--day-note-label);
      font-size: 10px;
      line-height: 1;
      font-weight: 720;
      letter-spacing: -0.02em;
    }

    .run-day-note-body {
      color: var(--day-note-ink);
      white-space: pre-line;
      font-size: 13px;
      font-weight: 640;
      line-height: 1.28;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .controls {

    .done-secondary-actions {

      gap: 10px;
    }

    .done-undo-btn {
      width: 100%;

      border-radius: 22px;
    }

    .full-btn, .ghost-btn {

      height: 56px;
      border-radius: 22px;
      font-weight: 950;
      font-size: 16px;
    }

    .full-btn { background: var(--accent); color: #fff; }

    .edit-screen {

      flex-direction: column;
      gap: 8px;
    }

    .edit-panel {
      flex: 1 1 auto;
      min-height: 0;
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;

      font-weight: 950;
      font-variant-numeric: tabular-nums;

    }

    .duration-btn {
      min-height: 30px;

      background: rgba(255,255,255,0.72);

      font-weight: 850;
      padding: 0 7px;
    }

    .small-action.danger { color: var(--danger); }
    .small-action.primary { background: var(--accent); color: #fff; border-color: transparent; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0;
      color: var(--muted);
      font-size: 12px;

    .step-card {

      padding: 8px 9px;

    .step-card .step-icon-tile {

    .step-controls {

    .icon-btn {

      min-height: 44px;

    .reset-routine-card.confirm {
      background: rgba(199, 95, 78, 0.12);

    .calendar-overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 14px);

    .calendar-panel {
      width: min(100%, 430px);
      max-height: 100%;

      flex-direction: column;

      font-size: 18px;
      font-weight: 950;

      height: 38px;

      grid-template-columns: repeat(7, 1fr);

      padding: 0 1px;

      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    @media (max-height: 700px) {

    .toast {

      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));

      padding: 10px 14px;

      font-size: 13px;
      font-weight: 800;

      top: 50%;

    .celebration-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2147483647;
      isolation: isolate;
    }

    .celebration-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;

      inset: 0;

      top: 45%;

      height: 96px;

      width: 142px;
      height: 142px;
      border-width: 4px;
      animation-delay: 80ms;
      animation-duration: 1220ms;
    }

    .celebration-layer.variant-firework .celebration-ring {
      width: 118px;
      height: 118px;
      animation-duration: 900ms;
    }

    .celebration-layer.variant-firework .celebration-ring.second {
      width: 176px;
      height: 176px;
      animation-duration: 1080ms;
    }

    .celebration-layer.variant-sparkle .celebration-flash {
      background: radial-gradient(circle at 50% 46%, rgba(255,255,255,0.96) 0 7%, rgba(255,255,255,0.42) 17%, transparent 54%);

    .celebration-layer.variant-ripple .celebration-ring {
      width: 130px;
      height: 130px;
      border-width: 5px;
      animation-duration: 1180ms;
    }

    .celebration-layer.variant-ripple .celebration-ring.second {
      width: 210px;
      height: 210px;
      animation-duration: 1380ms;

    .confetti-piece {

      top: 45%;

      height: calc(var(--size, 10px) * 0.72);

      background: var(--piece-color, var(--accent));

    @keyframes stepRewardPop {

    @keyframes doneCardPop {
      0% { transform: translateY(18px) scale(0.94); opacity: 0.62; }
      45% { transform: translateY(-5px) scale(1.035); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }

    @keyframes doneMarkPop {
      0% { transform: scale(0.58) rotate(-6deg); opacity: 0.08; }
      45% { transform: scale(1.2) rotate(3deg); opacity: 1; }

    @keyframes doneGlow {
      0% { opacity: 0; transform: scale(0.48); }
      34% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 0; transform: scale(1.72); }

    @keyframes celebrationFlash {
      0% { opacity: 0; }
      15% { opacity: 0.92; }
      100% { opacity: 0; }

    @keyframes celebrationRing {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.48); }
      25% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(2.65); }
    }

    @keyframes confettiBurst {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(0deg) scale(0.45); }
      10% { opacity: 1; }
      72% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(1); }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function routineDayDate() {
      const d = new Date();
      if (d.getHours() < DAY_START_HOUR) d.setDate(d.getDate() - 1);
      return d;
    }

    function todayKey() {
      return dateKeyFromDate(routineDayDate());
    }

    function todayKo() {
      return dateLabelKo(routineDayDate(), false);
    }


    function snapshotFromParts(completed = {}, offToday = {}, sessions = {}) {
      const snapshot = {};
      DISPLAY_ROUTINE_ORDER.forEach((id) => {
        if (offToday?.[id]) snapshot[id] = "off";
        else if (completed?.[id]) snapshot[id] = "done";
        else if (sessions?.[id]) snapshot[id] = "active";
        else snapshot[id] = "none";
      });
      return snapshot;
    }

    function updateTodayCalendar(targetState = state) {
      if (!targetState) return;
      if (!targetState.calendar || typeof targetState.calendar !== "object") targetState.calendar = {};
      const key = todayKey();
      const effectiveOff = { ...(targetState.offToday || {}) };
      const plan = targetState.dayPlans && typeof targetState.dayPlans === "object" ? targetState.dayPlans[key] : null;
      if (plan?.off && typeof plan.off === "object") {
        Object.entries(plan.off).forEach(([routineId, off]) => {
          if (off) effectiveOff[routineId] = true;
          else delete effectiveOff[routineId];
        });
      }
      const snapshot = snapshotFromParts(targetState.completed, effectiveOff, targetState.sessions);
      if (plan?.statuses && typeof plan.statuses === "object") {
        Object.entries(plan.statuses).forEach(([routineId, status]) => {
          if (["done", "none", "off"].includes(status)) snapshot[routineId] = status;
        });
      }
      targetState.calendar[key] = snapshot;
    }

    function dateKeyFromDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function dateLabelKo(date, withParentheses = false) {
      const weekday = WEEKDAY_LABELS[date.getDay()];
      const dayText = withParentheses ? `(${weekday})` : weekday;
      return `${date.getMonth() + 1}.${date.getDate()} ${dayText}`;
    }



    function normalizeDayPlans(source) {
      const result = {};
      Object.entries(source || {}).forEach(([key, raw]) => {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(key) || !raw || typeof raw !== "object") return;
        const off = raw.off && typeof raw.off === "object" ? { ...raw.off } : {};
        const notes = {};
        if (raw.notes && typeof raw.notes === "object") {
          Object.entries(raw.notes).forEach(([routineId, value]) => {
            const text = String(value || "").slice(0, 240);
            if (text.trim()) notes[routineId] = text;
          });
        }
        const statuses = {};
        if (raw.statuses && typeof raw.statuses === "object") {
          Object.entries(raw.statuses).forEach(([routineId, value]) => {
            const status = String(value || "");
            if (["done", "none", "off"].includes(status)) statuses[routineId] = status;
          });
        }
        result[key] = { off, notes, statuses };
      });
      return result;
    }

    function dateFromKey(key) {
      const [y, m, d] = String(key || "").split("-").map(Number);
      if (!y || !m || !d) return routineDayDate();
      return new Date(y, m - 1, d);
    }

    function dateKeyKo(key) {
      return dateLabelKo(dateFromKey(key), false);
    }

    function dateKeyPlanLabel(key) {
      return `${dateLabelKo(dateFromKey(key), true)} 루틴 수정하기`;
    }

    function isPastOrTodayKey(key) {
      return String(key || "") <= todayKey();
    }

    function hasOwn(obj, key) {
      return Object.prototype.hasOwnProperty.call(obj || {}, key);
    }

    function getDayPlan(key, create = false) {
      if (!state.dayPlans || typeof state.dayPlans !== "object") state.dayPlans = {};
      if (!state.dayPlans[key] && create) state.dayPlans[key] = { off: {}, notes: {}, statuses: {} };
      const plan = state.dayPlans[key];
      if (!plan) return null;
      if (!plan.off || typeof plan.off !== "object") plan.off = {};
      if (!plan.notes || typeof plan.notes !== "object") plan.notes = {};
      if (!plan.statuses || typeof plan.statuses !== "object") plan.statuses = {};
      return plan;
    }

    function cleanDayPlan(key) {
      const plan = getDayPlan(key, false);
      if (!plan) return;
      Object.keys(plan.notes || {}).forEach((routineId) => {
        if (!String(plan.notes[routineId] || "").trim()) delete plan.notes[routineId];
      });
      Object.keys(plan.statuses || {}).forEach((routineId) => {
        if (!["done", "none", "off"].includes(String(plan.statuses[routineId]))) delete plan.statuses[routineId];
      });
      const hasNotes = Object.keys(plan.notes || {}).length > 0;
      const hasOff = Object.keys(plan.off || {}).length > 0;
      const hasStatuses = Object.keys(plan.statuses || {}).length > 0;
      if (!hasNotes && !hasOff && !hasStatuses) delete state.dayPlans[key];
    }

    function defaultOffForRoutine(routineId) {
      return Boolean(defaultOffToday()[routineId]);
    }

    function effectiveOffForDate(key, routineId) {
      const plan = getDayPlan(key, false);
      if (plan && hasOwn(plan.off, routineId)) return Boolean(plan.off[routineId]);
      if (key === todayKey()) return Boolean(state.offToday?.[routineId]);
      return defaultOffForRoutine(routineId);
    }

    function dayNoteFor(key, routineId) {
      const plan = getDayPlan(key, false);
      return String(plan?.notes?.[routineId] || "").trim();
    }

    function setDayNote(key, routineId, value) {
      const plan = getDayPlan(key, true);
      const text = String(value || "").slice(0, 240);
      if (text.trim()) plan.notes[routineId] = text;
      else delete plan.notes[routineId];
      cleanDayPlan(key);
      saveState();
    }

    function setPlanOff(key, routineId, off) {
      const plan = getDayPlan(key, true);
      plan.off[routineId] = Boolean(off);
      if (key === todayKey()) {
        if (off) state.offToday[routineId] = true;
        else delete state.offToday[routineId];
      }
      cleanDayPlan(key);
      saveState();
    }

    function explicitDayStatus(key, routineId) {
      const plan = getDayPlan(key, false);
      const manual = plan?.statuses?.[routineId];
      if (["done", "none", "off"].includes(manual)) return manual;
      const entry = key === todayKey() ? snapshotFromParts(state.completed, state.offToday, state.sessions) : state.calendar?.[key];
      const status = entry?.[routineId];
      if (["done", "active", "off", "none"].includes(status)) return status === "active" ? "none" : status;
      return effectiveOffForDate(key, routineId) ? "off" : "none";
    }

    function setExplicitDayStatus(key, routineId, status) {
      if (!["done", "none", "off"].includes(status)) return;
      const plan = getDayPlan(key, true);
      plan.statuses[routineId] = status;
      if (!state.calendar || typeof state.calendar !== "object") state.calendar = {};
      if (!state.calendar[key]) state.calendar[key] = {};
      state.calendar[key][routineId] = status;
      if (status === "off") {
        plan.off[routineId] = true;
        if (key === todayKey()) {
          delete state.completed[routineId];
          delete state.sessions[routineId];
          state.offToday[routineId] = true;
        }
      } else {
        if (defaultOffForRoutine(routineId)) plan.off[routineId] = false;
        else delete plan.off[routineId];
        if (key === todayKey()) {
          delete state.offToday[routineId];
          delete state.sessions[routineId];
          if (status === "done") state.completed[routineId] = new Date().toISOString();
          else delete state.completed[routineId];
        }
      }
      cleanDayPlan(key);
      saveState();
    }

    function isPlainObject(value) {
      return Boolean(value && typeof value === "object" && !Array.isArray(value));
    }

    function safeObject(value, fallback = {}) {
      return isPlainObject(value) ? value : fallback;
    }

    function readStoredState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      return isPlainObject(parsed) ? parsed : null;
    }

    function readLocalUpdatedAt() {
      const value = Number(localStorage.getItem(LOCAL_UPDATED_AT_KEY));
      return Number.isFinite(value) && value > 0 ? value : 0;
    }

    function writeLocalUpdatedAt(value) {
      localStorage.setItem(LOCAL_UPDATED_AT_KEY, String(value));
    }

    function ensureLocalUpdatedAt() {
      let value = readLocalUpdatedAt();
      if (!value) {
        value = Date.now();
        writeLocalUpdatedAt(value);
      }
      return value;
    }

    function writeStoredState(targetState, options = {}) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(targetState));
      const nextCloudHash = cloudStateHash(targetState);
      const cloudChanged = options.cloud !== false && nextCloudHash !== lastLocalCloudHash;
      if (options.touch !== false && cloudChanged) writeLocalUpdatedAt(Date.now());
      if (cloudChanged) {
        lastLocalCloudHash = nextCloudHash;
        enqueueCloudSave(nextCloudHash);
      }
    }

      return {
        tag: BACKUP_TAG,
        app: "routiner",
        schema: BACKUP_SCHEMA,
        storageKey: STORAGE_KEY,
        appVersion: APP_VERSION,
        dayStartHour: DAY_START_HOUR,
        exportedAt: new Date().toISOString(),
        state: prepareStateForSave(clone(state))
      };
    }

    function parseBackupText(text) {
      const raw = String(text || "").trim();
      if (!raw) return null;
      try {
        const payload = JSON.parse(raw);
        if (!isPlainObject(payload)) return null;
        if (payload.tag !== BACKUP_TAG) return null;
        if (payload.app !== "routiner") return null;
        if (payload.schema !== BACKUP_SCHEMA) return null;
        if (payload.storageKey !== STORAGE_KEY) return null;
        if (!isPlainObject(payload.state)) return null;
        const nextState = normalizeLoadedState(payload.state);
        return { payload, nextState };
      } catch {
        return null;
      }
    }

    function normalizeStep(step, index, fallback) {
      const source = fallback || {};
      return {
        id: step.id || source.id || `step_${Date.now()}_${index}_${Math.random().toString(36).slice(2, 7)}`,
        icon: String(step.icon || source.icon || "·").slice(0, 4),
        title: String(step.title || source.title || "새 단계"),
        note: String(step.note ?? source.note ?? ""),
        minutes: Math.max(0.25, Number(step.minutes ?? source.minutes) || 1),
        capture: step.capture || source.capture || null
      };
    }

    function normalizeRoutineFromFixed(existing, fixed, resetToDefault = false) {
      const oldSteps = Array.isArray(existing?.steps) ? existing.steps : [];
      const sourceSteps = resetToDefault || oldSteps.length === 0 ? fixed.steps : oldSteps;
      const steps = sourceSteps.map((step, idx) => {
        const fixedStep = fixed.steps.find((item) => item.id === step.id) || fixed.steps[idx] || {};
        return normalizeStep(step, idx, fixedStep);
      });
      return {
        id: fixed.id,
        icon: fixed.icon,
        name: fixed.name,
        color: fixed.color,
        soft: fixed.soft,
        doneText: fixed.doneText,
        steps: steps.length ? steps : fixed.steps.map((step, idx) => normalizeStep(step, idx, step))
      };
    }
