name: Validate Routiner Data Safety

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate data safety patch
        shell: bash
        run: |
          set -euo pipefail
          test -f src/data-safety.js
          test -f firestore.rules
          test -f firebase.json
          test -f docs/firebase-rules-archive/2026-07-28-console-before-data-safety.rules
          grep -q 'data-safety.js' src/app.js
          grep -q 'private-defaults' src/data-safety.js
          grep -q 'MAX_CLOUD_SNAPSHOTS = 30' src/data-safety.js
          grep -q 'request.auth.uid == uid' firestore.rules
          grep -q 'documentId == "private-defaults"' firestore.rules
          grep -q "historyId.matches('slot-\[0-2\]\[0-9\]')" firestore.rules
          grep -q 'docId == "main"' docs/firebase-rules-archive/2026-07-28-console-before-data-safety.rules
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m json.tool firebase.json >/dev/null
          node tests/data-safety.mjs

      - name: Install browser
        run: |
          npm install --no-save playwright@1.52.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Run 390x844 recovery smoke test
        shell: bash
        run: |
          set -o pipefail
          python3 -m http.server 4175 >/tmp/routiner-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          ROUTINER_URL=http://127.0.0.1:4175/ node tests/smoke-routiner.mjs 2>&1 | tee /tmp/routiner-smoke.log

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routiner-smoke-diagnostics
          path: |
            /tmp/routiner-smoke.log
            /tmp/routiner-http.log
            /tmp/routiner-v156-smoke.png
          if-no-files-found: ignore
