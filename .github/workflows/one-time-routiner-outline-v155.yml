name: One-time Routiner modular refactor v1.55

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  refactor:
    if: github.actor == 'tos-dori' && github.event.issue.title == '[internal] Routiner modular refactor v1.55 run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/modular-architecture-v1-55
          fetch-depth: 0

      - name: Install refactor tools
        run: |
          npm install --no-save acorn@8 playwright@1.52.0 >/dev/null 2>&1

      - name: Split JavaScript and move stylesheet
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const assert = require('assert');
          const acorn = require('acorn');

          const source = fs.readFileSync('app.js', 'utf8');
          const parse = (code) => acorn.parse(code, {
            ecmaVersion: 'latest',
            sourceType: 'script',
            locations: true,
            allowAwaitOutsideFunction: true
          });
          const ast = parse(source);
          assert.strictEqual(ast.body.length, 271, `Unexpected top-level statement count: ${ast.body.length}`);

          const groups = [
            ['src/config.js', 1, 18],
            ['src/data/default-routines.js', 19, 21],
            ['src/dom.js', 22, 22],
            ['src/state-model.js', 23, 49],
            ['src/storage.js', 50, 71],
            ['src/sync.js', 72, 108],
            ['src/session.js', 109, 119],
            ['src/ui.js', 120, 131],
            ['src/calendar.js', 132, 136],
            ['src/runner.js', 137, 152],
            ['src/editor.js', 153, 167],
            ['src/feedback.js', 168, 176],
            ['src/runtime.js', 177, 198],
            ['src/scroll.js', 199, 212],
            ['src/backup.js', 213, 219],
            ['src/events.js', 220, 269],
            ['src/bootstrap.js', 270, 271]
          ];

          function statementSource(from, to) {
            return ast.body
              .slice(from - 1, to)
              .map((node) => source.slice(node.start, node.end))
              .join('\n\n') + '\n';
          }

          const generated = [];
          for (const [file, from, to] of groups) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            let content = statementSource(from, to);
            if (file === 'src/config.js') {
              content = content.replace('const APP_VERSION = "1.54";', 'const APP_VERSION = "1.55";');
              assert(content.includes('const APP_VERSION = "1.55";'), 'APP_VERSION update failed');
            }
            fs.writeFileSync(file, content, 'utf8');
            generated.push(content);
          }

          const loader = `(() => {
            const loaderScript = document.currentScript;
            const baseUrl = new URL('./', loaderScript.src);
            const moduleFiles = ${JSON.stringify(groups.map(([file]) => file.replace(/^src\//, '')), null, 2)};

            function loadClassicScript(relativePath) {
              return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = new URL(relativePath, baseUrl).href;
                script.async = false;
                script.dataset.routinerModule = relativePath;
                script.addEventListener('load', resolve, { once: true });
                script.addEventListener('error', () => reject(new Error(\`Failed to load \${relativePath}\`)), { once: true });
                document.head.appendChild(script);
              });
            }

            (async () => {
              for (const file of moduleFiles) await loadClassicScript(file);
              document.documentElement.dataset.routinerLoaded = 'true';
            })().catch((error) => {
              console.error('[Routiner] module load failed', error);
              const message = document.getElementById('authMessage');
              if (message) message.textContent = '앱을 불러오지 못했어. 새로고침해.';
            });
          })();
          `;
          fs.writeFileSync('src/app.js', loader, 'utf8');

          fs.mkdirSync('styles', { recursive: true });
          fs.copyFileSync('styles.css', 'styles/app.css');

          let index = fs.readFileSync('index.html', 'utf8');
          index = index.replace(/href="\.\/manifest\.webmanifest(?:\?v=[^"]+)?"/, 'href="./manifest.webmanifest"');
          index = index.replace(/href="\.\/styles\.css(?:\?v=[^"]+)?"/, 'href="./styles/app.css"');
          index = index.replace(/<script src="\.\/app\.js(?:\?v=[^"]+)?"><\/script>/, '<script src="./src/app.js"></script>');
          assert(index.includes('href="./styles/app.css"'), 'Stylesheet link update failed');
          assert(index.includes('src="./src/app.js"'), 'Script link update failed');
          assert(!index.includes('./styles.css'), 'Old stylesheet link remains');
          assert(!index.includes('./app.js'), 'Old script link remains');
          fs.writeFileSync('index.html', index, 'utf8');

          const expectedSource = source.replace('const APP_VERSION = "1.54";', 'const APP_VERSION = "1.55";');
          const expectedAst = parse(expectedSource);
          const generatedAst = parse(generated.join('\n'));

          function stripPositions(value) {
            if (Array.isArray(value)) return value.map(stripPositions);
            if (!value || typeof value !== 'object') return value;
            const result = {};
            for (const [key, child] of Object.entries(value)) {
              if (['start', 'end', 'loc'].includes(key)) continue;
              result[key] = stripPositions(child);
            }
            return result;
          }

          assert.deepStrictEqual(
            stripPositions(generatedAst),
            stripPositions(expectedAst),
            'Generated module bundle is not AST-equivalent to the original app.js'
          );

          const architecture = `# Routiner architecture\n\n## Stable entry files\n- \`index.html\`: fixed DOM skeleton and three asset links only. Routine, timer, calendar, editor, sync, copy, and CSS patches should not modify it.\n- \`manifest.webmanifest\`: PWA metadata.\n- \`styles/app.css\`: all visual styling.\n- \`src/app.js\`: ordered classic-script loader. Add a new module here only when a genuinely new code domain is introduced.\n\n## JavaScript responsibilities\n- \`src/config.js\`: version, storage keys, Firebase configuration, global constants.\n- \`src/data/default-routines.js\`: default routines and default display order.\n- \`src/dom.js\`: DOM element references.\n- \`src/state-model.js\`: dates, day plans, and state-shape helpers.\n- \`src/storage.js\`: local persistence, migrations, import/export serialization.\n- \`src/sync.js\`: authentication and Firestore synchronization.\n- \`src/session.js\`: routine sessions and time-format helpers.\n- \`src/ui.js\`: theme, screen switching, and home rendering.\n- \`src/calendar.js\`: monthly calendar rendering and navigation.\n- \`src/runner.js\`: routine execution, timer, step movement, completion.\n- \`src/editor.js\`: routine and step editing.\n- \`src/feedback.js\`: toast, saved indicator, reward, celebration.\n- \`src/runtime.js\`: live mutable runtime variables initialized after all core functions.\n- \`src/scroll.js\`: scroll-boundary and overscroll protection.\n- \`src/backup.js\`: backup panel actions.\n- \`src/events.js\`: event bindings only.\n- \`src/bootstrap.js\`: URL startup and final initialization.\n\n## Invariants\n- Keep storage key \`personal_routine_v01\` and existing saved-data compatibility.\n- Keep the loader order unless dependency testing proves a change is safe.\n- Do not move runtime initialization before storage and sync functions are defined.\n- Normal feature patches should touch only the responsible source file and, when visual, \`styles/app.css\`.\n`;
          fs.writeFileSync('ARCHITECTURE.md', architecture, 'utf8');

          fs.rmSync('app.js');
          fs.rmSync('styles.css');
          fs.rmSync('ARCHITECTURE_OUTLINE.txt', { force: true });
          fs.rmSync('.github/workflows/one-time-outline.yml', { force: true });
          NODE

      - name: Validate source structure
        shell: bash
        run: |
          set -euo pipefail
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          test -f styles/app.css
          test -f src/data/default-routines.js
          test ! -e app.js
          test ! -e styles.css
          test ! -e ARCHITECTURE_OUTLINE.txt
          test ! -e .github/workflows/one-time-outline.yml
          test "$(grep -c 'src/app.js' index.html)" -eq 1
          test "$(grep -c 'styles/app.css' index.html)" -eq 1
          test "$(grep -R -l 'personal_routine_v01' src | wc -l | tr -d ' ')" -eq 1
          python3 -m json.tool manifest.webmanifest >/dev/null

      - name: Browser smoke test
        shell: bash
        run: |
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 >/tmp/routiner-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const pageErrors = [];
            const badLocalResponses = [];
            page.on('pageerror', (error) => pageErrors.push(error.message));
            page.on('response', (response) => {
              if (response.url().startsWith('http://127.0.0.1:4173/') && response.status() >= 400) {
                badLocalResponses.push(`${response.status()} ${response.url()}`);
              }
            });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => document.documentElement.dataset.routinerLoaded === 'true', null, { timeout: 20000 });
            const result = await page.evaluate(() => ({
              version: APP_VERSION,
              renderHome: typeof renderHome,
              initFromUrl: typeof initFromUrl,
              moduleCount: document.querySelectorAll('script[data-routiner-module]').length,
              stylesheetLoaded: Array.from(document.styleSheets).some((sheet) => sheet.href?.endsWith('/styles/app.css')),
              authVisible: document.getElementById('authScreen')?.classList.contains('active') === true
            }));
            if (result.version !== '1.55') throw new Error(`Unexpected version: ${result.version}`);
            if (result.renderHome !== 'function' || result.initFromUrl !== 'function') throw new Error('Cross-file globals are unavailable');
            if (result.moduleCount !== 17) throw new Error(`Unexpected module count: ${result.moduleCount}`);
            if (!result.stylesheetLoaded) throw new Error('styles/app.css was not loaded');
            if (!result.authVisible) throw new Error('Initial auth screen is not visible');
            if (badLocalResponses.length) throw new Error(`Local resource errors: ${badLocalResponses.join(', ')}`);
            const fatalErrors = pageErrors.filter((message) => /ReferenceError|SyntaxError/.test(message));
            if (fatalErrors.length) throw new Error(`Runtime errors: ${fatalErrors.join(' | ')}`);
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit modular architecture
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor Routiner into maintainable modules"
          git push origin HEAD:codex/modular-architecture-v1-55
