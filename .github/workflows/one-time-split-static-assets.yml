name: One-time split static assets

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  split:
    if: github.actor == 'tos-dori' && github.event.issue.title == '[internal] Split static assets v1.54'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/split-static-assets-v1-54
          fetch-depth: 0

      - name: Split index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          import textwrap

          source = Path("index.html")
          html_source = source.read_text(encoding="utf-8")
          source_bytes = html_source.encode("utf-8")
          blob_sha = hashlib.sha1(f"blob {len(source_bytes)}\0".encode() + source_bytes).hexdigest()
          expected_sha = "f314574a9c47f676fe7e1c1997922bdf8a863c0b"
          if blob_sha != expected_sha:
              raise SystemExit(f"Unexpected index.html source: {blob_sha}")

          scripts = list(re.finditer(r"<script(?:\\s[^>]*)?>[\\s\\S]*?</script>", html_source, flags=re.I))
          styles = list(re.finditer(r"<style(?:\\s[^>]*)?>[\\s\\S]*?</style>", html_source, flags=re.I))
          if len(scripts) != 2 or len(styles) != 1:
              raise SystemExit(f"Unexpected inline blocks: scripts={len(scripts)}, styles={len(styles)}")

          manifest_block = scripts[0].group(0)
          app_block = scripts[1].group(0)
          style_block = styles[0].group(0)

          css = re.sub(r"^<style(?:\\s[^>]*)?>\\s*|\\s*</style>$", "", style_block, flags=re.I)
          js = re.sub(r"^<script(?:\\s[^>]*)?>\\s*|\\s*</script>$", "", app_block, flags=re.I)
          css = textwrap.dedent(css).strip() + "\n"
          js = textwrap.dedent(js).strip() + "\n"

          js = js.replace('const APP_VERSION = "1.53";', 'const APP_VERSION = "1.54";', 1)
          if 'const APP_VERSION = "1.54";' not in js:
              raise SystemExit("APP_VERSION replacement failed")
          css = css.replace(".timer-ring {\n", ".timer-ring {\n  --angle: 0deg;\n", 1)

          manifest = {
              "name": "Routiner",
              "short_name": "Routiner",
              "description": "개인 루틴 플레이어.",
              "id": "./",
              "start_url": "./",
              "display": "standalone",
              "background_color": "#dff4ff",
              "theme_color": "#dff4ff",
              "orientation": "portrait-primary",
          }

          index = html_source
          index = index.replace(manifest_block, '<link rel="manifest" href="./manifest.webmanifest?v=1.54" />', 1)
          index = index.replace(style_block, '<link rel="stylesheet" href="./styles.css?v=1.54" />', 1)
          index = index.replace(app_block, '<script src="./app.js?v=1.54"></script>', 1)
          index = index.replace(' style="--angle:0deg"', "", 1)
          index = re.sub(r"\n{3,}", "\n\n", index).strip() + "\n"

          if "<style" in index.lower():
              raise SystemExit("Inline style block remains")
          if re.search(r"<script(?![^>]*\\bsrc=)", index, flags=re.I):
              raise SystemExit("Inline script block remains")
          if "personal_routine_v01" in index or "personal_routine_v01" not in js:
              raise SystemExit("Storage code was not isolated correctly")

          Path("index.html").write_text(index, encoding="utf-8")
          Path("styles.css").write_text(css, encoding="utf-8")
          Path("app.js").write_text(js, encoding="utf-8")
          Path("manifest.webmanifest").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate split files
        shell: bash
        run: |
          node --check app.js
          test "$(grep -c '<link rel="stylesheet"' index.html)" -eq 1
          test "$(grep -c '<script src="./app.js?v=1.54"></script>' index.html)" -eq 1
          test "$(grep -c '<link rel="manifest"' index.html)" -eq 1
          python3 -m json.tool manifest.webmanifest >/dev/null

      - name: Commit split files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css app.js manifest.webmanifest
          git commit -m "Split inline assets into standalone files"
          git push origin HEAD:codex/split-static-assets-v1-54
