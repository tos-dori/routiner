name: Routiner auto patch

# run 2
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch index
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const APP_VERSION = "1.47";', 'const APP_VERSION = "1.48";', 1)
          old = '''      if (isDepartureCapture) {
        els.stepMemo.classList.remove("empty");
        els.stepMemo.classList.add("has-departure");
        els.stepMemo.innerHTML = `
          <div class="departure-editor">
            <label for="departureInput">출발</label>
            <input id="departureInput" class="departure-input" type="text" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="예: 11:50" value="${escapeAttr(departureText)}" />
          </div>
        `;
      } else {'''
          new = '''      if (isDepartureCapture) {
        els.stepMemo.classList.remove("empty");
        els.stepMemo.classList.add("has-departure");
        const existingDepartureInput = document.getElementById("departureInput");
        const canReuseDepartureInput = existingDepartureInput && els.stepMemo.contains(existingDepartureInput);
        if (!canReuseDepartureInput) {
          els.stepMemo.innerHTML = `
            <div class="departure-editor">
              <label for="departureInput">출발</label>
              <input id="departureInput" class="departure-input" type="text" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="예: 11:50" value="${escapeAttr(departureText)}" />
            </div>
          `;
        } else if (document.activeElement !== existingDepartureInput && existingDepartureInput.value !== departureText) {
          existingDepartureInput.value = departureText;
        }
      } else {'''
          if 'canReuseDepartureInput' not in s:
              if old not in s:
                  raise SystemExit('departure input block not found')
              s = s.replace(old, new, 1)
          if 'const APP_VERSION = "1.48";' not in s or 'canReuseDepartureInput' not in s:
              raise SystemExit('patch failed')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit index
        run: |
          git config user.name "chatgpt-patch"
          git config user.email "chatgpt-patch@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes"
            exit 0
          fi
          git commit -m "fix: preserve departure input focus"
          git push
