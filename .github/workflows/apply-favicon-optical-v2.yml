name: Apply Routiner favicon optical v2

on:
  push:
    paths:
      - ".github/workflows/apply-favicon-optical-v2.yml"

permissions:
  contents: write

jobs:
  patch-favicon-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check pillow

      - name: Verify assets and patch head links
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          root = Path.cwd()
          expected = {
              "favicon-16.png": ("2316d4a634a4dd65ac134f01c1180b8f8adf20118a699061d702580796b4e8bd", (16, 16)),
              "favicon-32.png": ("b0d98e67a83fef1569f3f4856b10969f0e7ca7760a00e2806bd457094564f216", (32, 32)),
              "favicon.ico": ("aeef7f261e83fdfc8f0728f91a2e88d124e899dc6ec6d95eeeec37eefa65b561", None),
          }

          for filename, (digest, size) in expected.items():
              path = root / filename
              assert path.is_file() and path.stat().st_size > 0, filename
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == digest, f"{filename}: {actual}"
              if size:
                  with Image.open(path) as image:
                      image.verify()
                  with Image.open(path) as image:
                      assert image.size == size, (filename, image.size)

          with Image.open(root / "favicon.ico") as icon:
              sizes = set(icon.ico.sizes())
              assert {(16, 16), (32, 32), (48, 48), (64, 64)}.issubset(sizes), sizes

          index_path = root / "index.html"
          index = index_path.read_text(encoding="utf-8")
          old = '''  <link rel="icon" type="image/svg+xml" href="./routiner-icon.svg?v=20260724b" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico?v=20260724b" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260724b" />
  <link rel="manifest" href="./manifest.webmanifest?v=20260724b" />'''
          new = '''  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=20260725a" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png?v=20260725a" />
  <link rel="shortcut icon" href="./favicon.ico?v=20260725a" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260725a" />
  <link rel="manifest" href="./manifest.webmanifest?v=20260725a" />'''
          assert index.count(old) == 1
          index = index.replace(old, new, 1)
          index_path.write_text(index, encoding="utf-8")

          check = index_path.read_text(encoding="utf-8")
          assert 'rel="icon" type="image/svg+xml"' not in check
          assert './favicon-32.png?v=20260725a' in check
          assert './favicon-16.png?v=20260725a' in check
          assert './favicon.ico?v=20260725a' in check
          assert './apple-touch-icon.png?v=20260725a' in check
          assert './manifest.webmanifest?v=20260725a' in check
          PY

          rm -f .github/workflows/apply-favicon-optical-v2.yml

          changed="$(git status --short)"
          echo "$changed"
          echo "$changed" | grep -q 'index.html'
          echo "$changed" | grep -q '.github/workflows/apply-favicon-optical-v2.yml'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-favicon-optical-v2.yml
          git commit -m "Use size-specific Routiner favicons"
          git push origin HEAD:main
