name: Apply Routiner v1.53 patch

on:
  push:
    branches:
      - codex/routiner-v1-53

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          payload = ""
          Path('/tmp/routiner-v153.patch').write_bytes(base64.b64decode(payload))
          PY
          git apply --check /tmp/routiner-v153.patch
          git apply /tmp/routiner-v153.patch
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          Path('/tmp/routiner-v153.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert 'const APP_VERSION = "1.53";' in html
          assert html.count('하체 3세트') == 1
          assert html.count('상체·코어 3세트') == 1
          assert html.count('전신 스트레칭') == 1
          PY
          node --check /tmp/routiner-v153.js
      - name: Commit patched index only
        shell: bash
        run: |
          rm .github/workflows/apply-routiner-v153.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-routiner-v153.yml
          git commit -m "Add compact exercise routines and refine run screen"
          git push
