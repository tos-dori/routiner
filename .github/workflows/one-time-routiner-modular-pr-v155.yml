name: One-time Routiner modular PR v1.55

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  refactor:
    if: github.head_ref == 'codex/modular-architecture-v1-55'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/modular-architecture-v1-55
          fetch-depth: 0
          show-progress: false

      - name: Check whether refactor is pending
        id: gate
        shell: bash
        run: |
          if [ -f tools/refactor-v155.js ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'Refactor already applied; nothing to run.'
          fi

      - name: Install AST tools
        if: steps.gate.outputs.needed == 'true'
        run: npm install --no-save acorn@8 playwright@1.52.0 >/dev/null 2>&1

      - name: Generate modular source files
        if: steps.gate.outputs.needed == 'true'
        run: node tools/refactor-v155.js

      - name: Validate source structure
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          test -f styles/app.css
          test -f src/data/default-routines.js
          test ! -e app.js
          test ! -e styles.css
          test ! -e ARCHITECTURE_OUTLINE.txt
          test ! -e .github/workflows/one-time-outline.yml
          test "$(grep -c 'src/app.js' index.html)" -eq 1
          test "$(grep -c 'styles/app.css' index.html)" -eq 1
          test "$(grep -R -l 'personal_routine_v01' src | wc -l | tr -d ' ')" -eq 1
          python3 -m json.tool manifest.webmanifest >/dev/null

      - name: Install preview browser
        if: steps.gate.outputs.needed == 'true'
        run: npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Run 390x844 browser smoke test
        id: smoke
        if: steps.gate.outputs.needed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/routiner-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          set +e
          node tools/browser-smoke-v155.js >/tmp/routiner-smoke.txt 2>&1
          CODE=$?
          set -e
          cat /tmp/routiner-smoke.txt
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit "$CODE"

      - name: Post failed smoke diagnostics
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### v1.55 browser smoke-test failure'
            echo
            echo '```text'
            cat /tmp/routiner-smoke.txt
            echo '```'
          } >/tmp/routiner-smoke-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/routiner-smoke-comment.md

      - name: Stop after failed smoke test
        if: steps.smoke.outcome == 'failure'
        run: exit 1

      - name: Remove temporary refactor tools
        if: steps.gate.outputs.needed == 'true' && steps.smoke.outcome == 'success'
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          rm -f tools/refactor-v155.js tools/browser-smoke-v155.js tools/run-refactor-v155.sh
          rmdir tools 2>/dev/null || true

      - name: Commit modular architecture
        if: steps.gate.outputs.needed == 'true' && steps.smoke.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor Routiner into maintainable modules"
          git push origin HEAD:codex/modular-architecture-v1-55
